services:
  - type: web
    name: mymoney-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mymoney-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: FRONTEND_URL
        value: https://frontend-seven-sigma-s7syfd9iv7.vercel.app,http://localhost:5173
      - key: EXCHANGE_RATE_API_KEY
        value: 0fe9acb002e50ab852947697

databases:
  - name: mymoney-db
    plan: free
